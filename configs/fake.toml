[llm]
backend = "fake"                       # replays gold labels; for pipeline checks without a model
model = ""                             # CHƯA CHỌN: tên model trên HF, điền khi chốt (mục 6.0)
revision = ""                          # CHƯA CHỌN: commit hash cố định của model
dtype = "auto"                         # "auto" | "float16" | "bfloat16"; auto chọn theo GPU (mục 4.16)
max_model_len = 16384
gpu_memory_utilization = 0.85          # giảm khi có ASR chạy chung GPU
seed = 0
max_tokens = 512
batch_invariant = false                # true khi chạy trên sm80+
warmup_runs = 2

[agent]
max_steps = 10
max_retries = 2
deadline_s = 29.0                      # giây tính từ đầu mẫu (gồm ASR); tới mốc này bước LLM đang chạy bị ngắt, call đã gọi vẫn được nộp
max_result_chars = 4000
system_prompt = "configs/prompts/system_v1.md"
guards = ["allowed_tool", "schema", "duplicate_write"]   # "after_ask" có sẵn nhưng không dùng, xem 4.9
format = "chatml"                      # "chatml": tool calling của Qwen, giống dữ liệu SFT của lead (lifemate/agent/chatml.py) | "json": định dạng cũ {"action": ...}
compact_tools = false                  # true: rút gọn schema tool ngay từ đầu (như compact_schema của lead)
constrain_tools = true                 # ép đầu ra: sau <tool_call> chỉ viết được tool đã cài, tham số đúng tên/kiểu/enum (lifemate/agent/chatml.py)

[asr]
backend = "gold"                       # "gold" | "asr" (sau v0)
model = ""                             # CHƯA CHỌN: chỉ cần khi backend = "asr"
revision = ""
device = "auto"                        # "auto" | "cpu" | "cuda"
batch_size = 8                         # số file wav mỗi lần gọi model (giữ thứ tự)
generate_kwargs = {}                   # vd {language = "vi", task = "transcribe"}; luôn greedy
sample_rate = 16000                    # WAV 16 kHz mono 16-bit (data README 2.1)
