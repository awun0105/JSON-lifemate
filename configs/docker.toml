# Run config for the inference image (docs/docker.md). Same as configs/v0.toml except that model
# paths point at the weights baked into /app/models and the real ASR is on.
[llm]
backend = "vllm"
model = "/app/models/llm"              # snapshot of [llm].model from configs/v0.toml (or the merged fine-tune)
revision = ""
dtype = "auto"
max_model_len = 16384
gpu_memory_utilization = 0.80
seed = 0
max_tokens = 512
batch_invariant = true                 # the organisers' A30 is sm80
warmup_runs = 2

[agent]
max_steps = 10
max_retries = 2
deadline_s = 29.0
max_result_chars = 4000
system_prompt = "configs/prompts/system_v1.md"
guards = ["allowed_tool", "schema", "duplicate_write"]

[asr]
backend = "asr"
engine = "faster_whisper"
model = "/app/models/asr"              # snapshot of [asr].model from configs/v0.toml (CTranslate2 files) or the fine-tune
revision = ""
device = "cuda"
dtype = "auto"
batch_size = 8
# Bỏ initial_prompt, repetition_penalty, no_repeat_ngram_size: sweep val_seen (asr_sweep_v1) cho WER 44.0% -> 29.7%,
# câu rỗng 190 -> 24, bỏ sót thực thể 52% -> 31%. Câu mồi làm Whisper bịa phụ đề YouTube trên audio bình thường
# (160/185 câu rỗng là "subscribe"/"đăng ký kênh" bị sanitizer xóa); đổi lại, không mồi thì Zalo, VTV, HTV hay sai.
generate_kwargs = { language = "vi", task = "transcribe", temperature = 0.0, beam_size = 5, best_of = 5, vad_filter = true, vad_parameters = { min_silence_duration_ms = 500 }, condition_on_previous_text = false }
sample_rate = 16000
sanitize = true
