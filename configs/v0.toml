[llm]
backend = "vllm"                       # "vllm" | "fake"
model = "Qwen/Qwen3-4B-Instruct-2507"  # 4,02B, Apache-2.0, 08/2025; chọn theo SPEC 6.0, SPEC phụ lục E.5
revision = "cdbee75f17c01a7cc42f958dc650907174af0554"
dtype = "auto"                         # "auto" | "float16" | "bfloat16"; auto chọn theo GPU (mục 4.16)
max_model_len = 16384
gpu_memory_utilization = 0.80          # chừa chỗ cho ASR chạy chung GPU (6.1, B2)
seed = 0
max_tokens = 512
batch_invariant = false                # true khi chạy trên sm80+
warmup_runs = 2

[agent]
max_steps = 10
max_retries = 2
deadline_s = 29.0                      # giây tính từ đầu mẫu (gồm ASR); tới mốc này bước LLM đang chạy bị ngắt, call đã gọi vẫn được nộp
max_result_chars = 4000
system_prompt = "configs/prompts/system_v1.md"
guards = ["allowed_tool", "schema", "duplicate_write"]   # "after_ask" có sẵn nhưng không dùng, xem 4.9
format = "chatml"                      # "chatml": tool calling của Qwen, giống dữ liệu SFT của lead (lifemate/agent/chatml.py) | "json": định dạng cũ {"action": ...}
compact_tools = false                  # true: rút gọn schema tool ngay từ đầu (như compact_schema của lead)

[asr]
backend = "gold"                       # "gold" | "asr"; đổi sang "asr" khi chạy trên audio thật
engine = "faster_whisper"              # "faster_whisper" (whisper-large-v3, mặc định) | "hf_seq2seq" (PhoWhisper) | "chunkformer" | "nemo_ctc" (Parakeet CTC)
model = "Systran/faster-whisper-large-v3"   # whisper-large-v3 bản CTranslate2, 1,54B, MIT; quyết định của team lead (SPEC phụ lục E.5.1)
revision = "edaa852ec7e145841d8ffdb056a99866b5f0a478"
device = "auto"                        # "auto" | "cpu" | "cuda"
dtype = "auto"                         # auto: bfloat16 trên sm80+ (A30), float16 trên T4, float32 trên CPU
batch_size = 8                         # số file wav mỗi lần gọi transcribe_batch (faster_whisper vẫn giải mã từng file)
# Giải mã: beam 5, nhiệt độ 0 (tất định), VAD bỏ khoảng lặng, không nối ngữ cảnh lượt trước (gốc từ team lead).
# Bỏ initial_prompt, repetition_penalty, no_repeat_ngram_size: sweep val_seen (asr_sweep_v1) cho WER 44.0% -> 29.7%,
# câu rỗng 190 -> 24, bỏ sót thực thể 52% -> 31%. Câu mồi làm Whisper bịa phụ đề YouTube trên audio bình thường
# (160/185 câu rỗng là "subscribe"/"đăng ký kênh" bị sanitizer xóa); đổi lại, không mồi thì Zalo, VTV, HTV hay sai.
generate_kwargs = { language = "vi", task = "transcribe", temperature = 0.0, beam_size = 5, best_of = 5, vad_filter = true, vad_parameters = { min_silence_duration_ms = 500 }, condition_on_previous_text = false }
sample_rate = 16000                    # WAV 16 kHz mono 16-bit (data README 2.1)
sanitize = true                        # lọc ảo giác kiểu phụ đề YouTube và vòng lặp (lifemate/backends/asr_sanitizer.py)
